name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: unzip -q makinebul-v2.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Lisanslari kabul et
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Debug keystore olustur
        working-directory: src
        run: >
          keytool -genkeypair -keystore debug.keystore -storepass android
          -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: APK derle
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MakineBul-debug-apk
          path: src/app/build/outputs/apk/debug/*.apk
